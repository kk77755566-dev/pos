name: Deploy InfinityFree POS (explicit trigger only)

on:
  push:
    branches:
      - feature/girlsbar-pos-foundation
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: girlsbar-pos-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/feature/girlsbar-pos-foundation' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Backend CI to pass for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow .github/workflows/backend-ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r '.status')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // empty')
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] || { echo "Backend CI did not pass: $conclusion"; exit 1; }
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Timed out waiting for Backend CI on $GITHUB_SHA"
          exit 1
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
      - name: Validate deployment files
        run: |
          php -l infinityfree/index.php
          php -l infinityfree/api.php
          php -l infinityfree/api_workflows.php
          php -l infinityfree/setup.php
          php -l infinityfree/health.php
          node --check infinityfree/pos.js
          node --check infinityfree/pos_cast.js
          node infinityfree/tests/validate_ui.mjs
      - name: Ensure private files are not in deployment payload
        run: |
          test ! -e infinityfree/config.php
          test -f infinityfree/config.example.php
          test -f infinityfree/database/schema.sql
          test -f infinityfree/setup.php
  deploy:
    needs: preflight
    if: github.ref == 'refs/heads/feature/girlsbar-pos-foundation' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/girlsbar-pos-foundation
      - name: Verify FTP credentials are configured
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "Missing GitHub Secret: FTP_SERVER" && exit 1)
          test -n "$FTP_USERNAME" || (echo "Missing GitHub Secret: FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing GitHub Secret: FTP_PASSWORD" && exit 1)
      - name: Upload application files (preserve server config and database)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'htdocs/' }}
          local-dir: ./infinityfree/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/config.php
            **/config.example.php
            **/bootstrap_owner.php
            **/database/**
            **/tests/**
            **/README.md
            **/API.md
      - name: Check live POS database and setup status
        if: always()
        run: |
          set +e
          response=$(curl -sS -L --max-time 25 -w '\n%{http_code}' https://pos777.site.je/health.php 2>&1)
          curl_rc=$?
          if [ "$curl_rc" -ne 0 ]; then
            echo "::warning::Live health endpoint could not be reached (curl exit $curl_rc)."
            printf '%s\n' "$response"
            exit 0
          fi
          http_code=$(printf '%s\n' "$response" | tail -n 1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "Live health HTTP status: $http_code"
          printf '%s\n' "$body"
          status=$(printf '%s' "$body" | jq -r '.status // "unrecognized_response"' 2>/dev/null)
          case "$status" in
            ready)
              echo "Live POS database is connected and the first store exists."
              ;;
            awaiting_first_setup)
              echo "::warning::Database and schema are ready, but the first store/owner has not been registered."
              ;;
            config_missing)
              echo "::warning::Server-side config.php is missing. Configure the private DB connection file."
              ;;
            schema_incomplete)
              echo "::warning::Database schema is incomplete. Import infinityfree/database/schema.sql into the intended empty database."
              ;;
            database_unavailable)
              echo "::warning::PHP could not connect to the configured database. Check hosting DB settings."
              ;;
            *)
              echo "::warning::Health endpoint returned an unrecognized status: $status"
              ;;
          esac
          echo "Live health probe is diagnostic only; it does not expose or modify credentials or database records."
