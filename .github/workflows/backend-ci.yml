name: Backend CI

on:
  push:
    branches:
      - feature/girlsbar-pos-foundation
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: girlsbar_pos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: girlsbar_pos
      DB_USER: root
      DB_PASSWORD: rootpass
      JWT_SECRET: ci-test-secret-with-at-least-32-characters-long
      JWT_ISSUER: girlsbar-pos
      INITIAL_STORE_CODE: CI-STORE
      INITIAL_STORE_NAME: CI Test Store
      INITIAL_OWNER_LOGIN: owner
      INITIAL_OWNER_PASSWORD: ci-owner-password-123
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
      - name: Lint InfinityFree PHP files
        run: |
          php -l ../infinityfree/index.php
          php -l ../infinityfree/api.php
          php -l ../infinityfree/api_workflows.php
          node --check ../infinityfree/pos.js
          node --check ../infinityfree/pos_cast.js
          node ../infinityfree/tests/validate_ui.mjs
          php -l ../infinityfree/config.example.php
          php -l ../infinityfree/bootstrap_owner.php
          php -l ../infinityfree/setup.php
          php -l ../infinityfree/health.php
      - name: Validate InfinityFree schema on MySQL 8
        working-directory: .
        run: |
          mysql -h127.0.0.1 -uroot -prootpass -e "CREATE DATABASE girlsbar_pos_infinityfree CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql -h127.0.0.1 -uroot -prootpass girlsbar_pos_infinityfree < infinityfree/database/schema.sql
      - name: Run InfinityFree PHP POS API integration
        working-directory: .
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpass
          POS_TEST_DB_NAME: girlsbar_pos_infinityfree
        run: |
          cat > infinityfree/config.php <<'PHP'
          <?php
          return [
            'db_host' => getenv('DB_HOST'),
            'db_name' => getenv('POS_TEST_DB_NAME'),
            'db_user' => getenv('DB_USER'),
            'db_password' => getenv('DB_PASSWORD'),
            'app_secret' => str_repeat('c', 64),
            'timezone' => 'Asia/Tokyo',
          ];
          PHP
          php infinityfree/tests/seed_ci.php
          php -S 127.0.0.1:8765 -t infinityfree > /tmp/girlsbar-pos-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true; rm -f infinityfree/config.php' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/api.php?r=csrf' >/dev/null; then break; fi
            sleep 1
          done
          python3 infinityfree/tests/api_integration.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q app scripts
      - name: Build production container
        working-directory: .
        run: docker build -f Dockerfile -t girlsbar-pos-api:ci .
      - name: Validate frontend JavaScript
        run: node ../frontend/validate.mjs
      - name: Apply MySQL schema
        working-directory: .
        run: |
          mysql -h127.0.0.1 -uroot -prootpass -e "CREATE DATABASE IF NOT EXISTS girlsbar_pos CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          mysql -h127.0.0.1 -uroot -prootpass girlsbar_pos < database/schema.sql
      - name: Bootstrap CI store
        run: python -m scripts.bootstrap_store
      - name: Run calculation tests
        run: PYTHONPATH=. pytest -q
