name: Backend CI

on:
  push:
    branches:
      - feature/girlsbar-pos-foundation
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: girlsbar_pos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: girlsbar_pos
      DB_USER: root
      DB_PASSWORD: rootpass
      JWT_SECRET: ci-test-secret-with-at-least-32-characters-long
      JWT_ISSUER: girlsbar-pos
      INITIAL_STORE_CODE: CI-STORE
      INITIAL_STORE_NAME: CI Test Store
      INITIAL_OWNER_LOGIN: owner
      INITIAL_OWNER_PASSWORD: ci-owner-password-123
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q app scripts
      - name: Validate frontend JavaScript
        run: node ../frontend/validate.mjs
      - name: Apply MySQL schema
        working-directory: .
        run: |
          mysql -h127.0.0.1 -uroot -prootpass -e "CREATE DATABASE IF NOT EXISTS girlsbar_pos CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          mysql -h127.0.0.1 -uroot -prootpass girlsbar_pos < database/schema.sql
      - name: Bootstrap CI store
        run: python -m scripts.bootstrap_store
      - name: Run calculation tests
        run: PYTHONPATH=. pytest -q
